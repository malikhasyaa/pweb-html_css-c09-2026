<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanal Aspirasi - Elon Musk</title>
    <link rel="stylesheet" href="cv.css">
</head>
<body>
<main class="aspirasi">
    <div class="container">
 
        <div class="section-header">
            <h1>Kanal Aspirasi</h1>
            <p>Punya pesan atau pertanyaan untuk Elon Musk? Sampaikan di sini.</p>
        </div>
 
        <form class="aspiration-form">
            <label for="nama">Nama</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama kamu" required>
 
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Masukkan email kamu" required>
 
            <label for="pesan">Pesan</label>
            <textarea id="pesan" name="pesan" rows="5" placeholder="Tulis pesan kamu..." required></textarea>
 
            <button type="submit">Kirim Aspirasi</button>
        </form> 
    </div>
</main>
</body>
</html>
